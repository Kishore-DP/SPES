<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>SPES Control</title>
<style>
  :root{
    --bg:#0b0b12; --card:#15151f; --card2:#1c1c2a; --line:#2a2a3c;
    --txt:#eaeaf2; --mut:#9a9ab0; --vio:#8b7bff; --cyan:#39d5d0; --pink:#ff6b9d;
    --red:#ff4d5e; --green:#37d67a; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:78px}
  header{position:sticky;top:0;z-index:5;background:rgba(11,11,18,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:19px;margin:0;font-weight:700;
    background:linear-gradient(90deg,var(--vio),var(--cyan));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:auto}
  .dot.on{background:var(--green)}
  .gear{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer}
  main{padding:16px;max-width:560px;margin:0 auto}
  .sec{display:none;animation:fade .25s ease}
  .sec.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;
    margin:4px 0 12px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px}
  input,select{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
  input:focus,select:focus{border-color:var(--vio)}
  .btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;
    font-weight:600;cursor:pointer;color:#fff;
    background:linear-gradient(90deg,var(--vio),var(--cyan))}
  .btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.danger{background:linear-gradient(90deg,#ff4d5e,#ff2d5e)}
  .row{display:flex;gap:10px;align-items:center}
  .list-item{display:flex;align-items:center;gap:12px;padding:12px 0;
    border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .list-item .txt{flex:1}
  .list-item .sub{font-size:13px;color:var(--mut)}
  .chk{width:22px;height:22px;border:2px solid var(--vio);border-radius:7px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .chk.done{background:var(--vio)}
  .done-txt{text-decoration:line-through;color:var(--mut)}
  .x{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;flex:none}
  .empty{color:var(--mut);text-align:center;padding:24px 0;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pic{border-radius:12px;overflow:hidden;background:var(--card2);position:relative}
  .pic img{width:100%;height:120px;object-fit:cover;display:block}
  .pic .ts{position:absolute;bottom:0;left:0;right:0;font-size:11px;padding:4px 8px;
    background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
  .sosbtn{background:radial-gradient(circle at 50% 30%,#ff5e6e,#d61f3a);
    border:none;color:#fff;border-radius:20px;padding:26px;font-size:22px;font-weight:800;
    width:100%;letter-spacing:.1em;box-shadow:0 8px 30px rgba(255,45,80,.35);cursor:pointer}
  .big{font-size:26px;font-weight:700}
  .mut{color:var(--mut);font-size:14px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,22,.96);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding:6px 4px 10px;z-index:5}
  nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0}
  nav button .ic{font-size:20px}
  nav button.active{color:var(--cyan)}
  label{font-size:13px;color:var(--mut);display:block;margin:0 0 6px}
  .field{margin-bottom:14px}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>SPES</h1>
  <span class="dot" id="dot"></span>
  <button class="gear" id="gear" title="Server settings">&#9881;</button>
</header>

<main>
  <!-- 1. TO-DO -->
  <section class="sec active" id="todo">
    <h2>To-do list</h2>
    <div class="card">
      <div class="row">
        <input id="todoInput" placeholder="Add a task..." maxlength="120">
        <button class="btn" style="width:auto;padding:12px 18px" id="todoAdd">Add</button>
      </div>
    </div>
    <div class="card"><div id="todoList"></div></div>
  </section>

  <!-- 2. SOS -->
  <section class="sec" id="sos">
    <h2>Emergency SOS</h2>
    <div class="card">
      <button class="sosbtn" id="sosBtn">SOS</button>
      <p class="mut" style="text-align:center;margin:12px 0 0">
        Sends your location + a photo to your guardians.</p>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Guardians</h2>
      <div class="field"><input id="cName" placeholder="Name"></div>
      <div class="field"><input id="cPhone" placeholder="Phone number"></div>
      <button class="btn sec2" id="cAdd">Add guardian</button>
      <div id="contactList" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- 3. AI ASSISTANT -->
  <section class="sec" id="assistant">
    <h2>AI assistant</h2>
    <div class="card">
      <div class="field">
        <label>Assistant voice</label>
        <select id="voiceSel"></select>
      </div>
      <div class="field">
        <label>Activation word</label>
        <input id="wakeInput" placeholder="e.g. Max">
      </div>
      <button class="btn" id="saveSettings">Save</button>
      <p class="mut" id="settingsNote" style="margin:12px 0 0"></p>
    </div>
  </section>

  <!-- 4. BLUETOOTH (temporary) -->
  <section class="sec" id="bt">
    <h2>Bluetooth</h2>
    <div class="card" style="text-align:center;padding:32px 16px">
      <div style="font-size:44px">&#128268;</div>
      <p class="big" style="margin:10px 0 4px">Coming soon</p>
      <p class="mut">On-device Bluetooth pairing will appear here.</p>
      <span class="pill">Temporary section</span>
    </div>
  </section>

  <!-- 5. PICTURES -->
  <section class="sec" id="pics">
    <h2>Pictures &middot; recent 10</h2>
    <div class="card">
      <button class="btn" id="capBtn">Capture now</button>
    </div>
    <div id="picGrid" class="grid"></div>
  </section>

  <!-- 6. LOCATION -->
  <section class="sec" id="loc">
    <h2>Location</h2>
    <div class="card" id="locCard">
      <p class="mut">Loading location...</p>
    </div>
    <div class="card">
      <button class="btn" id="beepBtn">&#128266; Beep &mdash; find my SPES</button>
    </div>
  </section>
</main>

<nav>
  <button class="active" data-t="todo"><span class="ic">&#128203;</span>To-do</button>
  <button data-t="sos"><span class="ic">&#128680;</span>SOS</button>
  <button data-t="assistant"><span class="ic">&#129302;</span>Assistant</button>
  <button data-t="bt"><span class="ic">&#128268;</span>Bluetooth</button>
  <button data-t="pics"><span class="ic">&#128247;</span>Pictures</button>
  <button data-t="loc"><span class="ic">&#128205;</span>Location</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const API = localStorage.getItem('spesServer') || '';   // same origin by default
const $ = s => document.querySelector(s);
const dot = $('#dot');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200); }

async function api(path, opts){
  const r = await fetch(API + path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  dot.classList.add('on');
  if(!r.ok) throw new Error('HTTP '+r.status);
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}

// ---- tabs ----
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); $('#'+b.dataset.t).classList.add('active');
  if(b.dataset.t==='pics') loadPics();
  if(b.dataset.t==='loc') loadLoc();
});

// ---- server settings ----
$('#gear').onclick=()=>{
  const cur = localStorage.getItem('spesServer')||'';
  const v = prompt('SPES server URL (blank = same site as this page):', cur);
  if(v!==null){ localStorage.setItem('spesServer', v.trim()); location.reload(); }
};

// ---- 1. TO-DO ----
function renderTodos(list){
  const el=$('#todoList');
  if(!list.length){ el.innerHTML='<div class="empty">No tasks yet</div>'; return; }
  el.innerHTML='';
  list.forEach(t=>{
    const d=document.createElement('div'); d.className='list-item';
    d.innerHTML=`<div class="chk ${t.done?'done':''}">${t.done?'&#10003;':''}</div>
      <div class="txt ${t.done?'done-txt':''}">${esc(t.text)}</div>
      <button class="x">&times;</button>`;
    d.querySelector('.chk').onclick=async()=>renderTodos(await api('/api/todos/'+t.id,{method:'PATCH'}));
    d.querySelector('.x').onclick=async()=>renderTodos(await api('/api/todos/'+t.id,{method:'DELETE'}));
    el.appendChild(d);
  });
}
$('#todoAdd').onclick=addTodo;
$('#todoInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTodo();});
async function addTodo(){
  const v=$('#todoInput').value.trim(); if(!v)return;
  renderTodos(await api('/api/todos',{method:'POST',body:JSON.stringify({text:v})}));
  $('#todoInput').value='';
}

// ---- 2. SOS ----
function renderContacts(list){
  const el=$('#contactList');
  if(!list.length){ el.innerHTML='<div class="empty">No guardians added</div>'; return; }
  el.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div'); d.className='list-item';
    d.innerHTML=`<div class="txt">${esc(c.name)}<div class="sub">${esc(c.phone)}</div></div>
      <button class="x">&times;</button>`;
    d.querySelector('.x').onclick=async()=>renderContacts(await api('/api/contacts/'+c.id,{method:'DELETE'}));
    el.appendChild(d);
  });
}
$('#cAdd').onclick=async()=>{
  const name=$('#cName').value.trim(), phone=$('#cPhone').value.trim();
  if(!name||!phone){toast('Enter name and phone');return;}
  renderContacts(await api('/api/contacts',{method:'POST',body:JSON.stringify({name,phone})}));
  $('#cName').value=''; $('#cPhone').value=''; toast('Guardian added');
};
$('#sosBtn').onclick=async()=>{
  if(!confirm('Send an emergency SOS to your guardians now?'))return;
  toast('Sending SOS...');
  try{ const r=await api('/api/sos',{method:'POST',body:'{}'}); toast(r.message||'SOS sent'); }
  catch(e){ toast('SOS failed'); }
};

// ---- 3. ASSISTANT ----
async function loadSettings(){
  const voices=await api('/api/voices');
  const s=await api('/api/settings');
  $('#voiceSel').innerHTML=voices.map(v=>`<option ${v===s.voice?'selected':''}>${v}</option>`).join('');
  $('#wakeInput').value=s.wakeWord;
  $('#settingsNote').textContent=`Current: voice ${s.voice}, wake word "${s.wakeWord}".`;
}
$('#saveSettings').onclick=async()=>{
  const voice=$('#voiceSel').value, wakeWord=$('#wakeInput').value.trim()||'Max';
  const s=await api('/api/settings',{method:'POST',body:JSON.stringify({voice,wakeWord})});
  $('#settingsNote').textContent=`Current: voice ${s.voice}, wake word "${s.wakeWord}".`;
  toast('Settings saved');
};

// ---- 5. PICTURES ----
async function loadPics(){
  const pics=await api('/api/pictures'); const g=$('#picGrid');
  if(!pics.length){ g.innerHTML='<div class="empty" style="grid-column:1/3">No pictures yet</div>'; return; }
  g.innerHTML='';
  pics.forEach(p=>{
    const d=document.createElement('div'); d.className='pic';
    const t=new Date(p.time*1000).toLocaleString();
    d.innerHTML=`<img src="${API+p.url}" loading="lazy"><div class="ts">${t}</div>`;
    g.appendChild(d);
  });
}
$('#capBtn').onclick=async()=>{
  toast('Capturing...');
  try{ const r=await api('/api/pictures/capture',{method:'POST',body:'{}'});
    if(r.ok){ toast('Photo captured'); loadPics(); } else toast('Camera not reachable'); }
  catch(e){ toast('Camera not reachable'); }
};

// ---- 6. LOCATION ----
async function loadLoc(){
  const c=$('#locCard'); c.innerHTML='<p class="mut">Loading location...</p>';
  try{
    const l=await api('/api/location');
    if(!l.ok){ c.innerHTML='<p class="mut">Location unavailable</p>'; return; }
    c.innerHTML=`<div class="big">${esc(l.city)}</div>
      <div class="mut">${l.lat.toFixed(5)}, ${l.lon.toFixed(5)}</div>
      <a class="btn" style="margin-top:14px;display:block;text-align:center;text-decoration:none"
         href="${l.maps}" target="_blank">Open in Google Maps</a>`;
  }catch(e){ c.innerHTML='<p class="mut">Could not load location</p>'; }
}
$('#beepBtn').onclick=async()=>{
  toast('Beeping SPES...');
  try{ await api('/api/beep',{method:'POST',body:'{}'}); toast('Beep sent'); }
  catch(e){ toast('Beep failed'); }
};

function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---- boot ----
(async()=>{
  try{ renderTodos(await api('/api/todos')); renderContacts(await api('/api/contacts'));
    await loadSettings(); }
  catch(e){ dot.classList.remove('on'); toast('Cannot reach SPES server'); }
})();
</script>
</body>
</html>
